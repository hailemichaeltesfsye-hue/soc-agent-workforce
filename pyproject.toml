[project]
name = "soc-agent-workforce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hailemichael tesfaye", email = "your.hailemichaeltesfsye@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "markupsafe>=3.0.3",
    "numpy>=2.5.2",
    "overrides>=7.7.0",
    "packaging>=26.3",
    "pybase64>=1.5.0",
    "python-dotenv>=1.2.3",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "setuptools>=84.0.0",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "typing-inspection>=0.4.4",
]

[project.scripts]
soc-agent-workforce = "soc_agent_workforce:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
